name: Build posts index

# Whenever a post is added/edited (from the GitHub app, the web editor, or git),
# regenerate posts/index.json and commit it back. GitHub Pages then redeploys.
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/build-posts.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posts-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate posts/index.json
        run: node scripts/build-posts.mjs
      - name: Commit index if changed
        run: |
          if git diff --quiet -- posts/index.json; then
            echo "index.json unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/index.json
          git commit -m "chore: rebuild posts index"
          git pull --rebase origin main
          git push origin HEAD:main
